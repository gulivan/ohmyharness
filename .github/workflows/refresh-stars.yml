name: Refresh GitHub stars

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-stars
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh star counts
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Refresh data/tools
        run: npm run refresh:stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-stars
          delete-branch: true
          title: Refresh GitHub stars
          commit-message: Refresh GitHub stars
          add-paths: data/tools
          body: |
            Weekly refresh of `github.stars` and `github.checkedAt` in
            `data/tools/*.json`.

            Generated by `.github/workflows/refresh-stars.yml`. Only the two
            GitHub fields change; review the diff and merge when it looks
            right.
