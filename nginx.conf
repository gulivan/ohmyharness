server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Fingerprinted build assets never change under the same name.
  location /_astro/ {
    expires 1y;
    try_files $uri =404;
  }

  # Plain-text and machine-readable files.
  location = /llms.txt {
    default_type text/plain;
    expires 1h;
  }

  location = /robots.txt {
    default_type text/plain;
    expires 1h;
  }

  location = /api/tools.json {
    default_type application/json;
    expires 1h;
  }

  # Pages revalidate so a redeploy is picked up immediately. Check the
  # directory index first so /tools/<slug> is served directly instead of
  # redirecting to a trailing slash that is not in the canonical URL.
  location / {
    expires -1;
    try_files $uri/index.html $uri.html $uri =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
